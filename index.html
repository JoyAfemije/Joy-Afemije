<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#FBF7F2" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#16110E" media="(prefers-color-scheme: dark)" />

    <!-- Set the theme before first paint so there is no flash of the wrong colors -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('theme');
          var theme =
            stored ||
            (window.matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light');
          document.documentElement.setAttribute('data-theme', theme);
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      })();
    </script>

    <!-- Primary SEO -->
    <title>CodeWithTana · Frontend & Full-Stack Developer</title>
    <meta
      name="description"
      content="CodeWithTana is the portfolio of a frontend and full-stack developer based in Lagos, Nigeria, crafting calm, beautiful, reliable web experiences on the MERN stack."
    />
    <meta name="author" content="CodeWithTana" />
    <link rel="canonical" href="https://etana-portfolio.vercel.app/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="CodeWithTana · Frontend & Full-Stack Developer" />
    <meta
      property="og:description"
      content="Calm, beautiful, dependable web experiences. From a clean interface to a solid, scalable backend."
    />
    <meta property="og:image" content="./images/farmsphere.png" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="CodeWithTana · Frontend & Full-Stack Developer" />
    <meta
      name="twitter:description"
      content="Frontend and full-stack developer based in Lagos, Nigeria. MERN stack. Calm, considered, dependable."
    />

    <!-- Fonts: Fraunces (soft editorial display serif) + Inter (UI/body) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,300..700&family=Inter:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />

    <!-- Inline SVG favicon — terracotta dot mark -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='10' fill='%23FBF7F2'/%3E%3Ccircle cx='16' cy='16' r='5.5' fill='%23B3542C'/%3E%3C/svg%3E"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
